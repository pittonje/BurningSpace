name: Core Pull Request Checks

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Audit trusted PR-risk routing
        run: |
          python .github/scripts/test-classify-pr-risk.py
          python .github/scripts/test-claude-qa-audit.py

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run test suite
        run: npm test

      - name: Build workspaces
        run: npm run build
        env:
          VITE_BURNINGSPACE_SERVER_URL: https://arena-api.example.invalid

      - name: Typecheck workspaces
        run: npm run typecheck

      - name: Check protocol profile compatibility
        run: npm run check:protocol-profile

      - name: Network client callback diagnostic
        run: npx tsx apps/client/scripts/network-client-callback-check.ts

      - name: Movement diagnostic
        run: npx tsx apps/server/scripts/movement-check.ts

      - name: Combat diagnostic
        run: npx tsx apps/server/scripts/combat-check.ts

      - name: Typecheck external staging verification scripts
        run: npx tsc -p apps/server/scripts/tsconfig.external-staging.json --noEmit

      - name: Validate external staging preflight and committed templates
        run: |
          npx tsx apps/server/scripts/external-staging-preflight.ts --self-test
          npx tsx apps/server/scripts/external-staging-smoke.ts --self-test
          docker compose \
            --env-file deploy/external-staging.env.example \
            -f deploy/docker-compose.staging.yml \
            config --format json | \
            npx tsx apps/server/scripts/external-staging-preflight.ts \
              --template \
              --env deploy/external-staging.env.example \
              --plan deploy/external-staging-plan.example.json \
              --compose-stdin

      - name: Validate Caddy edge contract
        shell: bash
        run: |
          set -euo pipefail

          release="deploy/edge/caddy/caddy-validation-release.json"
          artifact_url="$(jq -r '.artifactUrl' "$release")"
          artifact_name="$(jq -r '.artifactName' "$release")"
          artifact_sha256="$(jq -r '.sha256' "$release")"
          artifact_sha512="$(jq -r '.sha512' "$release")"
          checksums_url="$(jq -r '.checksumManifestUrl' "$release")"
          checksums_sha256="$(jq -r '.checksumManifestSha256' "$release")"
          archive="$RUNNER_TEMP/$artifact_name"
          checksums="$RUNNER_TEMP/caddy-checksums.txt"
          caddy_root="$RUNNER_TEMP/caddy-2.11.4"
          caddy_logs="$RUNNER_TEMP/caddy-validation-logs"
          rendered="$RUNNER_TEMP/BurningSpace-Caddyfile"
          adapted="$RUNNER_TEMP/BurningSpace-Caddyfile.json"

          test "$(jq -r '.product' "$release")" = "Caddy"
          test "$(jq -r '.version' "$release")" = "2.11.4"
          test "$(jq -r '.architecture' "$release")" = "linux/amd64"
          test "$(jq -r '.thirdPartyModules | length' "$release")" -eq 0
          test "$(jq -r '.plugins | length' "$release")" -eq 0
          test "$(jq -r '.hostPackageInstalled' "$release")" = "false"
          npx tsx apps/server/scripts/external-staging-edge-preflight.ts --self-test
          npx tsx apps/server/scripts/external-staging-edge-preflight.ts --template
          case "$artifact_url" in
            https://github.com/caddyserver/caddy/releases/download/v2.11.4/*) ;;
            *) echo "Caddy artifact is not the pinned official release." >&2; exit 1 ;;
          esac

          curl --proto '=https' --tlsv1.2 --fail --location --silent --show-error \
            "$artifact_url" --output "$archive"
          curl --proto '=https' --tlsv1.2 --fail --location --silent --show-error \
            "$checksums_url" --output "$checksums"
          printf '%s  %s\n' "$artifact_sha256" "$archive" | sha256sum --check --strict
          printf '%s  %s\n' "$checksums_sha256" "$checksums" | sha256sum --check --strict
          printf '%s  %s\n' "$artifact_sha512" "$archive" | sha512sum --check --strict
          published_sha512="$(awk -v name="$artifact_name" '$2 == name { print $1 }' "$checksums")"
          test "$published_sha512" = "$artifact_sha512"

          mkdir -p "$caddy_root"
          tar -xzf "$archive" -C "$caddy_root"
          caddy="$caddy_root/caddy"
          test -x "$caddy"
          test "$("$caddy" version | awk '{print $1}')" = "v2.11.4"

          mkdir -p "$caddy_logs"
          npx tsx apps/server/scripts/external-staging-edge-preflight.ts \
            --render --output "$rendered" --log-directory "$caddy_logs"
          format_diff="$("$caddy" fmt --diff "$rendered")"
          if printf '%s\n' "$format_diff" | grep -Eq '^[+-]'; then
            printf '%s\n' "$format_diff"
            echo "Rendered Caddyfile is not canonically formatted." >&2
            exit 1
          fi
          "$caddy" adapt --config "$rendered" --adapter caddyfile >"$adapted"
          "$caddy" validate --config "$rendered" --adapter caddyfile
          npx tsx apps/server/scripts/external-staging-edge-preflight.ts \
            --inspect-adapted-config --adapted-config "$adapted"

          contract_result="$(BURNINGSPACE_CADDY_BINARY="$caddy" \
            npx tsx apps/server/scripts/external-staging-edge-contract-check.ts --self-test)"
          printf '%s\n' "$contract_result"
          CONTRACT_RESULT="$contract_result" node <<'NODE'
          const result = JSON.parse(process.env.CONTRACT_RESULT || '{}');
          const checks = result.checks || {};
          if (!result.ok || result.runtimeExecuted !== true || result.caddyVersion !== '2.11.4' ||
              Object.keys(checks).length !== 17 || Object.values(checks).some((value) => value !== true)) {
            throw new Error('Caddy runtime contract did not execute every required assertion.');
          }
          console.log(JSON.stringify({
            ok: true,
            event: 'caddy_edge_contract_assertions_verified',
            checks: Object.keys(checks).length
          }));
          NODE

      - name: Scan Phase A files for high-signal secret material
        shell: bash
        run: |
          node <<'NODE'
          const { readFileSync } = require('node:fs');
          const files = [
            'deploy/external-staging.env.example',
            'deploy/external-staging-plan.example.json',
            'deploy/docker-compose.staging.yml',
            'deploy/docker-compose.staging.build.yml',
            'apps/server/scripts/external-staging-preflight.ts',
            'apps/server/scripts/external-staging-smoke.ts',
            'apps/server/scripts/external-staging-edge-preflight.ts',
            'apps/server/scripts/external-staging-edge-contract-check.ts',
            'apps/server/scripts/tsconfig.external-staging.json',
            'deploy/edge/caddy/Caddyfile.template',
            'deploy/edge/caddy/edge.env.example',
            'deploy/edge/caddy/edge-plan.example.json',
            'deploy/edge/caddy/caddy-validation-release.json',
            'docs/ops/public-arena-caddy-edge-runbook.md',
            'docs/ops/public-arena-external-staging-runbook.md',
            'docs/ops/ops-002-phase-b-go-packet.md',
            '.github/workflows/pr-checks.yml'
          ];
          const contents = files.map((file) => readFileSync(file, 'utf8')).join('\n');
          const findings = [
            /-----BEGIN [A-Z ]*PRIVATE KEY-----\r?\n[A-Za-z0-9+/=]{20,}/u,
            /\b(?:ghp_|github_pat_|xox[baprs]-|AKIA)[A-Za-z0-9_-]{20,}\b/u,
            /\bsk-[A-Za-z0-9_-]{20,}\b/u
          ].filter((pattern) => pattern.test(contents));
          if (findings.length > 0) {
            throw new Error('High-signal credential or private-key material detected in Phase A files.');
          }
          console.log(JSON.stringify({ ok: true, event: 'phase_a_secret_scan_completed', files: files.length }));
          NODE

      - name: Validate staging containers and runtime lifecycle
        shell: bash
        env:
          VITE_BURNINGSPACE_SERVER_URL: https://arena-api.example.invalid
          BURNINGSPACE_SMOKE_SERVER_URL: http://127.0.0.1:2567
          BURNINGSPACE_SMOKE_ORIGIN: https://arena.example.com
          BURNINGSPACE_SMOKE_HOSTILE_ORIGIN: https://hostile.example.invalid
        run: |
          set -euo pipefail

          project="burningspace-ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          compose() {
            docker compose \
              -p "$project" \
              --env-file deploy/staging.env.example \
              -f deploy/docker-compose.staging.yml \
              -f deploy/docker-compose.staging.build.yml \
              "$@"
          }
          cleanup() {
            compose down --volumes --remove-orphans >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          compose config --quiet
          compose config --format json >"$RUNNER_TEMP/burningspace-compose.json"
          node - "$RUNNER_TEMP/burningspace-compose.json" <<'NODE'
          const { readFileSync } = require('node:fs');
          const model = JSON.parse(readFileSync(process.argv[2], 'utf8'));
          const services = model.services || {};
          if (Object.keys(services).sort().join(',') !== 'client,server') {
            throw new Error('Expected exactly the client and server Compose services.');
          }
          const expected = {
            server: { cpus: 1, memory: 1073741824 },
            client: { cpus: 0.25, memory: 268435456 }
          };
          for (const [name, service] of Object.entries(services)) {
            for (const port of service.ports || []) {
              if (port.host_ip !== '127.0.0.1') throw new Error('Every published port must bind exactly 127.0.0.1.');
            }
            if (Number(service.cpus) !== expected[name].cpus) throw new Error(`${name} CPU limit is incorrect.`);
            if (Number(service.mem_limit) !== expected[name].memory) throw new Error(`${name} memory limit is incorrect.`);
            if (service.logging?.driver !== 'json-file' || service.logging?.options?.['max-size'] !== '10m' ||
                String(service.logging?.options?.['max-file']) !== '3') {
              throw new Error(`${name} Docker log bounds are incorrect.`);
            }
            if (Object.keys(service.networks || {}).join(',') !== 'burningspace') {
              throw new Error(`${name} must use only the project-scoped BurningSpace network.`);
            }
            if (service.privileged === true) throw new Error('Privileged Compose service is forbidden.');
            if (service.network_mode === 'host') throw new Error('Host networking is forbidden.');
            if (service.read_only !== true) throw new Error('Every service must retain a read-only root filesystem.');
            if (!Array.isArray(service.tmpfs) || !service.tmpfs.some((entry) => String(entry).startsWith('/tmp'))) {
              throw new Error('Every service must retain its /tmp tmpfs.');
            }
            if (service.volumes && service.volumes.length > 0) {
              throw new Error('Service bind mounts and persistent volumes are forbidden.');
            }
          }
          const networks = model.networks || {};
          if (Object.keys(networks).join(',') !== 'burningspace' || networks.burningspace.external === true ||
              networks.burningspace.name !== `${model.name}_burningspace` ||
              (networks.burningspace.driver && networks.burningspace.driver !== 'bridge')) {
            throw new Error('Expected one non-external project-scoped bridge network.');
          }
          if (model.volumes && Object.keys(model.volumes).length > 0) throw new Error('Named volumes are forbidden.');
          console.log(JSON.stringify({ ok: true, event: 'compose_hardening_validated', services: Object.keys(services).length }));
          NODE
          compose build server client
          compose up -d server client

          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:2567/health >/dev/null; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              compose logs server
              exit 1
            fi
            sleep 1
          done

          curl --fail --silent http://127.0.0.1:2567/ready >/dev/null
          curl --fail --silent http://127.0.0.1:8080/ >/dev/null

          client_origin="http://127.0.0.1:8080"
          fail_cache_check() {
            echo "Cache policy check failed: $*" >&2
            exit 1
          }
          read_client_response() {
            local path="$1"
            response_headers="$(
              curl --silent --show-error --dump-header - --output /dev/null \
                "${client_origin}${path}" | tr -d '\r'
            )"
            response_status="$(
              printf '%s\n' "$response_headers" |
                awk '/^HTTP\// { status = $2 } END { print status }'
            )"
            response_cache_control="$(
              printf '%s\n' "$response_headers" |
                awk '
                  tolower($0) ~ /^cache-control:[[:space:]]*/ {
                    sub(/^[^:]*:[[:space:]]*/, "")
                    printf "%s%s", separator, $0
                    separator = ", "
                  }
                  END { print "" }
                '
            )"
            response_cache_control_lower="$(
              printf '%s' "$response_cache_control" | tr '[:upper:]' '[:lower:]'
            )"
          }
          require_status() {
            local expected="$1"
            local path="$2"
            if [ "$response_status" != "$expected" ]; then
              fail_cache_check "$path returned $response_status; expected $expected"
            fi
          }
          reject_contradictory_cache_policy() {
            local path="$1"
            if [[ "$response_cache_control_lower" == *"max-age=31536000"* ]] &&
              [[ "$response_cache_control_lower" == *"max-age=0"* ||
                "$response_cache_control_lower" == *"no-cache"* ||
                "$response_cache_control_lower" == *"no-store"* ||
                "$response_cache_control_lower" == *"must-revalidate"* ]]; then
              fail_cache_check "$path has contradictory Cache-Control values: $response_cache_control"
            fi
            if [[ "$response_cache_control_lower" == *"immutable"* ]] &&
              [[ "$response_cache_control_lower" == *"max-age=0"* ||
                "$response_cache_control_lower" == *"no-cache"* ||
                "$response_cache_control_lower" == *"no-store"* ||
                "$response_cache_control_lower" == *"must-revalidate"* ]]; then
              fail_cache_check "$path has contradictory Cache-Control values: $response_cache_control"
            fi
          }

          index_html="$(curl --fail --silent "${client_origin}/index.html")"
          entry_asset="$(
            printf '%s' "$index_html" |
              grep -oE '/assets/index-[A-Za-z0-9_-]+\.(js|css)' |
              head -n 1 || true
          )"
          if [ -z "$entry_asset" ]; then
            fail_cache_check "index.html did not reference a fingerprinted Vite entry asset"
          fi

          read_client_response "$entry_asset"
          require_status 200 "$entry_asset"
          reject_contradictory_cache_policy "$entry_asset"
          if [[ "$response_cache_control_lower" != *"public"* ||
            "$response_cache_control_lower" != *"max-age=31536000"* ||
            "$response_cache_control_lower" != *"immutable"* ]]; then
            fail_cache_check "$entry_asset has unexpected Cache-Control values: $response_cache_control"
          fi
          echo "fingerprinted_entry=$entry_asset cache-control=$response_cache_control"

          stable_asset="/assets/space-background.jpg"
          read_client_response "$stable_asset"
          require_status 200 "$stable_asset"
          reject_contradictory_cache_policy "$stable_asset"
          if [[ "$response_cache_control_lower" == *"immutable"* ||
            "$response_cache_control_lower" == *"max-age=31536000"* ]]; then
            fail_cache_check "$stable_asset retained long-lived immutable caching: $response_cache_control"
          fi
          if [[ "$response_cache_control_lower" != *"public"* ]] ||
            { [[ "$response_cache_control_lower" != *"no-cache"* ]] &&
              { [[ "$response_cache_control_lower" != *"max-age=0"* ]] ||
                [[ "$response_cache_control_lower" != *"must-revalidate"* ]]; }; }; then
            fail_cache_check "$stable_asset lacks a revalidation-safe Cache-Control policy: $response_cache_control"
          fi
          echo "stable_asset=$stable_asset cache-control=$response_cache_control"

          read_client_response "/index.html"
          require_status 200 "/index.html"
          reject_contradictory_cache_policy "/index.html"
          if [[ "$response_cache_control_lower" != *"no-store"* ]]; then
            fail_cache_check "/index.html lacks no-store: $response_cache_control"
          fi
          echo "index_html=/index.html cache-control=$response_cache_control"

          missing_asset="/assets/ops-001-cache-policy-missing.txt"
          read_client_response "$missing_asset"
          require_status 404 "$missing_asset"
          if [ -n "$response_cache_control" ]; then
            fail_cache_check "$missing_asset unexpectedly received Cache-Control: $response_cache_control"
          fi
          echo "missing_asset=$missing_asset status=$response_status cache-control=<absent>"

          mapfile -t generated_assets < <(find apps/client/dist -type f -name 'index-*.js' -print)
          if [ "${#generated_assets[@]}" -eq 0 ]; then
            echo "No generated client JavaScript entry asset was available for inspection." >&2
            exit 1
          fi
          node - "${generated_assets[@]}" <<'NODE'
          const { readFileSync } = require('node:fs');
          const contents = process.argv.slice(2).map((file) => readFileSync(file, 'utf8')).join('\n');
          if (!contents.includes('https://arena-api.example.invalid')) {
            throw new Error('Expected public server origin is absent from generated client assets.');
          }
          const forbidden = [
            /-----BEGIN [A-Z ]*PRIVATE KEY-----/u,
            /\b(?:github_pat_|ghp_|xox[baprs]-|AKIA)[A-Za-z0-9_-]{12,}\b/u,
            /\bsk-[A-Za-z0-9_-]{20,}\b/u,
            /reconnectionToken\s*[:=]\s*["'][A-Za-z0-9_-]{8,}:[A-Za-z0-9_-]{8,}["']/u,
            /(?:^|\n)(?:NODE_ENV|BURNINGSPACE_ALLOWED_ORIGINS|SSH_PRIVATE_KEY|PROVIDER_API_TOKEN)=/u
          ];
          if (forbidden.some((pattern) => pattern.test(contents))) {
            throw new Error('Generated client assets contain high-signal secret, token, or environment-file material.');
          }
          console.log(JSON.stringify({ ok: true, event: 'generated_client_asset_safety_validated', files: process.argv.length - 2 }));
          NODE

          npx tsx apps/server/scripts/public-arena-smoke.ts

          external_smoke="$({
            BURNINGSPACE_EXTERNAL_SMOKE_CLIENT_ORIGIN=http://127.0.0.1:8080 \
            BURNINGSPACE_EXTERNAL_SMOKE_SERVER_ORIGIN=http://127.0.0.1:2567 \
            BURNINGSPACE_EXTERNAL_SMOKE_ALLOWED_ORIGIN=https://arena.example.com \
            BURNINGSPACE_EXTERNAL_SMOKE_HOSTILE_ORIGIN=https://hostile.example.invalid \
            BURNINGSPACE_EXTERNAL_SMOKE_ALLOW_LOOPBACK_HTTP=true \
            BURNINGSPACE_EXTERNAL_SMOKE_TIMEOUT_MS=15000 \
              npx tsx apps/server/scripts/external-staging-smoke.ts
          })"
          printf '%s\n' "$external_smoke"
          EXTERNAL_SMOKE_RESULT="$external_smoke" node <<'NODE'
          const result = JSON.parse(process.env.EXTERNAL_SMOKE_RESULT || '{}');
          const checks = result.checks || {};
          if (!result.ok || !checks.hostileRawWebSocketRejected || !checks.reconnectCallSucceeded ||
              !checks.sameSession || !checks.shipContinuity || !checks.noDuplicateParticipantPlayer ||
              !checks.noDuplicateShip || !checks.noDuplicateParticipantOrShip ||
              result.reconnectTokenPrinted !== false) {
            throw new Error('External staging loopback smoke omitted a mandatory assertion.');
          }
          console.log(JSON.stringify({ ok: true, event: 'external_smoke_assertions_verified' }));
          NODE

          server_id="$(compose ps -q server)"
          compose stop server
          exit_code="$(docker inspect --format '{{.State.ExitCode}}' "$server_id")"
          test "$exit_code" -eq 0

          docker logs "$server_id" >"$RUNNER_TEMP/burningspace-server.log" 2>&1
          grep -q '"event":"shutdown_started"' "$RUNNER_TEMP/burningspace-server.log"
          grep -q '"event":"shutdown_completed"' "$RUNNER_TEMP/burningspace-server.log"
          if grep -q '"event":"shutdown_failed"' "$RUNNER_TEMP/burningspace-server.log"; then
            exit 1
          fi

          compose down --volumes --remove-orphans
